(function () {
  var b = document.getElementById('boot');
  function hide() { if (!b) return; b.classList.add('done'); var x = b; b = null; setTimeout(function () { x.remove(); }, 500); }
  var t = setInterval(function () {
    var v = document.getElementById('view');
    if (v && v.children.length) { clearInterval(t); hide(); }
  }, 60);
  setTimeout(hide, 10000);
})();
</script>
