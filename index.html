<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>revolutione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <a class="logo" href="#/legal"><span class="logo-word">revolutione</span><span class="logo-q">”</span></a>
      <button class="icon-btn" id="collapseBtn" data-act="collapse" aria-label="Свернуть панель"></button>
    </div>
    <nav class="side-nav" id="nav" aria-label="Разделы"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim" data-act="closeDrawer"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" data-act="openDrawer" aria-label="Открыть меню"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <button class="search-trigger" id="searchBtn" data-act="palette"><span class="st-icon" id="searchIcon"></span><span class="st-text">Поиск</span><kbd>Ctrl K</kbd></button>
        <select class="select" id="serverSelect" aria-label="Сервер"></select>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<dialog id="palette">
  <div class="pal">
    <input id="palInput" type="text" placeholder="Документы, статьи, шаблоны, памятки" autocomplete="off">
    <div class="pal-list" id="palList"></div>
  </div>
</dialog>

<dialog id="dialog"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
<script src="orgs.js"></script>
</body>
</html>
